services:
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: orchestrator-envoy
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "info"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:8080"
      - "9901:9901"
    extra_hosts:
      - "host.docker.internal:host-gateway"
