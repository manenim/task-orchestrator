apiVersion: batch/v1
kind: Job
metadata:
  name: orchestrator-smoke
  namespace: task-orchestrator-demo
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: task-orchestrator:dev
          imagePullPolicy: IfNotPresent
          command: [/app/smoke]
          env:
            - name: SERVER_ADDR
              value: server:50051
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
